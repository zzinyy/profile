<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>나만의 자리 (패스키로 잠김)</title>

<!--
  SimpleWebAuthn Browser 10.0.0
  백엔드 @simplewebauthn/server 10.0.1과 같은 메이저 버전
-->
<script src="https://unpkg.com/@simplewebauthn/browser@10.0.0/dist/bundle/index.umd.min.js"></script>

<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }

  a.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #555;
    text-decoration: none;
  }

  h1 {
    font-size: 1.4rem;
  }

  section {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;

    margin-bottom: 8px;

  button {

    align-items: center;
    padding: 6px 0;
  }

  #private-area {
    display: none;
  }
</style>
</head>

<body>

<a class="back" href="./index.html">
  &larr; 공개 소개 페이지로
</a>

<h1>나만의 자리</h1>

<p>
  이 자리는 패스키(생체인증/기기 인증)로만 열립니다.
  비밀번호는 사용하지 않습니다.
</p>


<!-- ============================================================
     로그인 전
     ============================================================ -->

<section id="auth-area">

  <input
    id="username"
    placeholder="아이디 (예: zzinyy)"
  />

  <div>

    <button type="button" onclick="register()">
      패스키 등록
    </button>

    <button
      type="button"
      class="secondary"
      onclick="login()"
    >
      패스키로 로그인
    </button>

  </div>

  <div id="status"></div>

</section>


<!-- ============================================================
     로그인 후
     ============================================================ -->

<section id="private-area">

  <p>
    로그인됨:
    <b id="who"></b>

    <button
      type="button"
      class="secondary"
      onclick="logout()"
    >
      로그아웃
    </button>
  </p>

  <h3>비공개 항목</h3>

  <div id="items"></div>

  <h3>내 패스키 목록</h3>

  <div id="passkeys"></div>

  <button
    type="button"
    class="secondary"
    onclick="register()"
  >
    패스키 추가 등록
  </button>

</section>


<script>

/* ============================================================
   기본 설정
   ============================================================ */

const API_BASE =
  "https://passkey-backend-pe26.onrender.com";


/* ============================================================
   상태 메시지
   ============================================================ */

function log(message) {

  const status =
    document.getElementById("status");

  if (status) {
    status.textContent = message;
  }

  console.log(message);
}


/* ============================================================
   SimpleWebAuthn 함수 가져오기
   ============================================================ */

function getWebAuthn() {

  if (
    typeof window.SimpleWebAuthnBrowser === "undefined"
  ) {

    throw new Error(
      "패스키 라이브러리를 불러오지 못했습니다. 페이지를 새로고침하거나 CDN 연결을 확인하세요."
    );

  }

  return window.SimpleWebAuthnBrowser;
}


/* ============================================================
   인증 헤더
   ============================================================ */

function authHeaders() {

  const token =
    localStorage.getItem("sessionToken");

  if (!token) {
    return {};
  }

  return {
    Authorization: "Bearer " + token
  };
}


/* ============================================================
   패스키 등록
   ============================================================ */

async function register() {

  console.log("register() 실행");


  const usernameElement =
    document.getElementById("username");


  const username =
    usernameElement.value.trim();


  if (!username) {

    log("아이디를 입력하세요.");

    return;
  }


  try {

    /* SimpleWebAuthn 확인 */

    const {
      startRegistration
    } = getWebAuthn();


    log(
      "등록 정보를 준비하는 중..."
    );


    /* --------------------------------------------------------
       1. 서버에 등록 옵션 요청
       -------------------------------------------------------- */

    const optRes =
      await fetch(
        `${API_BASE}/api/register/options`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username: username
          })
        }
      );


    const response =
      await optRes.json();


    if (!optRes.ok) {

      throw new Error(
        response.error ||
        "등록 옵션 생성 실패"
      );
    }


    const regToken =
      response.regToken;


    /*
      서버에서 받은 response에서
      regToken만 제외하고 WebAuthn 옵션으로 사용
    */

    const options = {
      ...response
    };


    delete options.regToken;


    /* --------------------------------------------------------
       2. 패스키 이름 입력
       -------------------------------------------------------- */

    const nickname =
      prompt(
        "이 패스키의 이름을 지어주세요 (예: 내 노트북)"
      ) || "패스키";


    /* --------------------------------------------------------
       3. 브라우저에서 패스키 생성
       
       browser 10.x에서는 기존 방식:
       startRegistration(options)
       -------------------------------------------------------- */

    log(
      "패스키 인증을 시작합니다..."
    );


    const attResp =
      await startRegistration(
        options
      );


    /* --------------------------------------------------------
       4. 서버에 등록 결과 전달
       -------------------------------------------------------- */

    log(
      "패스키 생성 완료. 서버에서 확인하는 중..."
    );


    const verifyRes =
      await fetch(
        `${API_BASE}/api/register/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            attResp: attResp,
            nickname: nickname,
            regToken: regToken
          })
        }
      );


    const result =
      await verifyRes.json();


    if (
      !verifyRes.ok ||
      !result.verified
    ) {

      throw new Error(
        result.error ||
        "패스키 등록 실패"
      );
    }


    log(
      "패스키 등록 완료! 이제 '패스키로 로그인'을 눌러보세요."
    );


  } catch (error) {

    console.error(
      "패스키 등록 오류:",
      error
    );


    if (
      error.name ===
      "NotAllowedError"
    ) {

      log(
        "패스키 등록이 취소되었습니다."
      );

    } else {

      log(
        "오류: " +
        (error.message || error)
      );
    }
  }
}


/* ============================================================
   패스키 로그인
   ============================================================ */

async function login() {

  console.log("login() 실행");


  const usernameElement =
    document.getElementById("username");


  const username =
    usernameElement.value.trim();


  if (!username) {

    log("아이디를 입력하세요.");

    return;
  }


  try {

    /* SimpleWebAuthn 확인 */

    const {
      startAuthentication
    } = getWebAuthn();


    log(
      "로그인 정보를 준비하는 중..."
    );


    /* --------------------------------------------------------
       1. 서버에 로그인 옵션 요청
       -------------------------------------------------------- */

    const optRes =
      await fetch(
        `${API_BASE}/api/login/options`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username: username
          })
        }
      );


    const response =
      await optRes.json();


    if (!optRes.ok) {

      throw new Error(
        response.error ||
        "로그인 옵션 생성 실패"
      );
    }


    const loginToken =
      response.loginToken;


    /*
      loginToken을 제외한 나머지가
      WebAuthn 인증 옵션
    */

    const options = {
      ...response
    };


    delete options.loginToken;


    /* --------------------------------------------------------
       2. 패스키 인증
       
       browser 10.x:
       startAuthentication(options)
       -------------------------------------------------------- */

    log(
      "패스키 인증을 시작합니다..."
    );


    const authResp =
      await startAuthentication(
        options
      );


    /* --------------------------------------------------------
       3. 서버에서 인증 결과 검증
       -------------------------------------------------------- */

    log(
      "인증 완료. 서버에서 확인하는 중..."
    );


    const verifyRes =
      await fetch(
        `${API_BASE}/api/login/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            authResp: authResp,
            loginToken: loginToken
          })
        }
      );


    const result =
      await verifyRes.json();


    if (
      !verifyRes.ok ||
      !result.verified
    ) {

      throw new Error(
        result.error ||
        "로그인 실패"
      );
    }


    /* --------------------------------------------------------
       4. 세션 토큰 저장
       -------------------------------------------------------- */

    localStorage.setItem(
      "sessionToken",
      result.sessionToken
    );


    log(
      "로그인 성공"
    );


    await loadPrivate();


  } catch (error) {

    console.error(
      "패스키 로그인 오류:",
      error
    );


    if (
      error.name ===
      "NotAllowedError"
    ) {

      log(
        "패스키 로그인이 취소되었습니다."
      );

    } else {

      log(
        "오류: " +
        (error.message || error)
      );
    }
  }
}


/* ============================================================
   로그아웃
   ============================================================ */

async function logout() {

  try {

    await fetch(
      `${API_BASE}/api/logout`,
      {
        method: "POST",

        headers:
          authHeaders()
      }
    );

  } catch (error) {

    console.error(
      "로그아웃 오류:",
      error
    );
  }


  localStorage.removeItem(
    "sessionToken"
  );


  document.getElementById(
    "private-area"
  ).style.display =
    "none";


  document.getElementById(
    "auth-area"
  ).style.display =
    "block";


  log(
    "로그아웃되었습니다."
  );
}


/* ============================================================
   비공개 영역
   ============================================================ */

async function loadPrivate() {

  const res =
    await fetch(
      `${API_BASE}/api/private`,
      {
        headers:
          authHeaders()
      }
    );


  if (!res.ok) {

    return;
  }


  const data =
    await res.json();


  document.getElementById(
    "who"
  ).textContent =
    data.username;


  document.getElementById(
    "items"
  ).innerHTML =
    data.items
      .map(
        (item) =>
          `<div class="item">
            <b>${item.title}</b>
            <br>
            ${item.body}
          </div>`
      )
      .join("");


  document.getElementById(
    "auth-area"
  ).style.display =
    "none";


  document.getElementById(
    "private-area"
  ).style.display =
    "block";


  await loadPasskeys();
}


/* ============================================================
   패스키 목록
   ============================================================ */

async function loadPasskeys() {

  const res =
    await fetch(
      `${API_BASE}/api/passkeys`,
      {
        headers:
          authHeaders()
      }
    );


  if (!res.ok) {

    return;
  }


  const list =
    await res.json();


  document.getElementById(
    "passkeys"
  ).innerHTML =
    list
      .map(
        (p) =>
          `<div class="passkey-row">

            <span>
              ${p.name}
              (${new Date(
                p.createdAt
              ).toLocaleDateString()})
            </span>

            <button
              type="button"
              class="secondary"
              onclick="removePasskey('${p.id}')"
            >
              삭제
            </button>

          </div>`
      )
      .join("");
}


/* ============================================================
   패스키 삭제
   ============================================================ */

async function removePasskey(id) {

  try {

    const res =
      await fetch(
        `${API_BASE}/api/passkeys/${encodeURIComponent(id)}`,
        {
          method: "DELETE",

          headers:
            authHeaders()
        }
      );


    const result =
      await res.json();


    if (result.warning) {

      log(
        result.warning
      );
    }


    await loadPasskeys();


  } catch (error) {

    console.error(
      "패스키 삭제 오류:",
      error
    );

    log(
      "패스키 삭제 중 오류가 발생했습니다."
    );
  }
}


/* ============================================================
   페이지 로드 시 기존 로그인 확인
   ============================================================ */

(async function checkLogin() {

  const token =
    localStorage.getItem(
      "sessionToken"
    );


  if (!token) {

    return;
  }


  try {

    const res =
      await fetch(
        `${API_BASE}/api/me`,
        {
          headers:
            authHeaders()
        }
      );


    const data =
      await res.json();


    if (data.loggedIn) {

      await loadPrivate();

    } else {

      localStorage.removeItem(
        "sessionToken"
      );
    }


  } catch (error) {

    console.error(
      "자동 로그인 확인 오류:",
      error
    );

    localStorage.removeItem(
      "sessionToken"
    );
  }

})();

</script>

</body>
</html>
```
